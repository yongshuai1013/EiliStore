name: EiliStore
options:
  bundleIdPrefix: com.eili
  deploymentTarget:
    iOS: "15.0"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    version: 0.9.19
  SideSign:
    url: https://github.com/yongshuai1013/SideSign.git
    revision: da194c60f5366394fb715354391952dd9ca89ac4
  CodeSignKit:
    url: https://github.com/mahee96/CodeSignKit.git
    branch: main
  EMProxy:
    path: Packages/EMProxy
targets:
  EiliStore:
    type: application
    platform: iOS
    sources:
      - Sources/EiliStore
    dependencies:
      - package: ZIPFoundation
      - package: SideSign
      - package: CodeSignKit
      - package: EMProxy
      - framework: Libraries/IDeviceFFI.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eili.eilistore
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    info:
      path: Sources/EiliStore/Info.plist
      properties:
        CFBundleDisplayName: EiliStore
        UILaunchStoryboardName: LaunchScreen
        UIBackgroundModes:
          - audio
schemes:
  EiliStore:
    build:
      targets:
        EiliStore: all
    run:
      config: Debug
    archive:
      config: Release
