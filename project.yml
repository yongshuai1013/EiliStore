name: EiliStore
options:
  bundleIdPrefix: com.eili
  deploymentTarget:
    iOS: "15.0"
targets:
  EiliStore:
    type: application
    platform: iOS
    sources:
      - Sources/EiliStore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eili.eilistore
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    info:
      path: Sources/EiliStore/Info.plist
      properties:
        CFBundleDisplayName: EiliStore
        UILaunchStoryboardName: LaunchScreen
schemes:
  EiliStore:
    build:
      targets:
        EiliStore: all
    run:
      config: Debug
    archive:
      config: Release
