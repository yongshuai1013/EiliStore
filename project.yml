name: EiliStore
options:
  bundleIdPrefix: com.eili
  deploymentTarget:
    iOS: "15.0"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    version: 0.9.19
  SideSign:
    url: https://github.com/yongshuai1013/SideSign.git
    branch: feat/apptokens-mac-client-info
  CodeSignKit:
    url: https://github.com/mahee96/CodeSignKit.git
    branch: main
  EMProxy:
    path: Packages/EMProxy
  AnisetteKit:
    url: https://github.com/yongshuai1013/AnisetteKit.git
    branch: main
targets:
  EiliStore:
    type: application
    platform: iOS
    sources:
      - Sources/EiliStore
    dependencies:
      - package: ZIPFoundation
      - package: SideSign
      - package: CodeSignKit
      - package: EMProxy
      - package: AnisetteKit
      - framework: Libraries/IDeviceFFI.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eili.eilistore
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) EILI_ON_DEVICE_ANISETTE"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/EiliStore/EiliStore-Bridging-Header.h
        # RustLogin 靜態庫（Scripts/build-rust-login.sh 先行構建，CI 先跑該步）
        HEADER_SEARCH_PATHS: $(SRCROOT)/build/rust-login-out/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/build/rust-login-out/lib/$(PLATFORM_NAME)
        OTHER_LDFLAGS: -lapparition_anisette
    info:
      path: Sources/EiliStore/Info.plist
      properties:
        CFBundleDisplayName: EiliStore
        NSCameraUsageDescription: "掃描 Session 二維碼需要使用相機"
        UILaunchStoryboardName: LaunchScreen
        UIBackgroundModes:
          - audio
schemes:
  EiliStore:
    build:
      targets:
        EiliStore: all
    run:
      config: Debug
    archive:
      config: Release
