name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download IDevice xcframework (SideStore prebuilt)
        run: |
          mkdir -p /tmp/idevice_dl
          curl -L -o /tmp/idevice_dl/idevice.zip "https://github.com/SideStore/idevice/releases/download/v0.1.68-ss-3e55c84/idevice-xcframework-v0.1.68-ss-3e55c84.zip"
          mkdir -p Libraries
          unzip -q -o /tmp/idevice_dl/idevice.zip -d /tmp/idevice_dl/
          XCFRAMEWORK=$(find /tmp/idevice_dl -name "*.xcframework" -type d | head -1)
          echo "Found: $XCFRAMEWORK"
          rm -rf Libraries/IDeviceFFI.xcframework
          cp -R "$XCFRAMEWORK" Libraries/IDeviceFFI.xcframework
      
      - name: Install xcodegen
        run: brew install xcodegen
        
      - name: Generate project
        run: xcodegen generate
        
      - name: Build IPA
        run: |
          xcodebuild archive \
            -project EiliStore.xcodeproj \
            -scheme EiliStore \
            -destination 'generic/platform=iOS' \
            -archivePath build/EiliStore.xcarchive \
            CODE_SIGNING_ALLOWED=NO
          mkdir -p build/Payload
          cp -r build/EiliStore.xcarchive/Products/Applications/EiliStore.app build/Payload/
          cd build && zip -r EiliStore.ipa Payload/ && cd ..
          
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: EiliStore-ipa
          path: build/EiliStore.ipa
