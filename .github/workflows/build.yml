name: Build

on:
  push:
    branches: [main, feat/on-device-production-20261022, feat/applemusic-653-libraries-20261022, feat/sidestore-runtime-adi-20261022]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-anisette-abi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run pinned TCI native ABI tests (synthetic guest code only)
        run: bash Tests/run-anisette-native-tests.sh

  settings-navigation-ui:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen for isolated navigation harness
        run: brew install xcodegen
      - name: Verify real Settings navigation on iPhone simulator (no Apple login)
        run: bash Tests/run-settings-navigation-ui-tests.sh
      - name: Upload navigation screenshots and UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settings-navigation-ui-evidence
          path: |
            build/settings-navigation-ui.xcresult
            build/settings-navigation-ui.log
            build/settings-navigation-screenshots
          if-no-files-found: ignore
          retention-days: 7

  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Run offline mode selection and IPA tests (no Apple services)
        run: |
          bash Tests/run-adi-elf-tests.sh
          PYTHONDONTWRITEBYTECODE=1 python3 Tests/test_adi_loader_contract.py
          bash Tests/run-anisette-tests.sh
          bash Tests/run-adi-download-tests.sh
          PYTHONDONTWRITEBYTECODE=1 python3 Tests/test_user_customizations_navigation.py
          bash Tests/run-anisette-client-config-tests.sh
          bash Tests/run-sidesign-client-config-tests.sh
          bash Tests/run-developer-portal-service-tests.sh
          bash Tests/run-ipa-import-tests.sh
          PYTHONDONTWRITEBYTECODE=1 python3 Tests/test_ipa_import_navigation.py
          bash Tests/run-ipa-installer-tests.sh
          PYTHONDONTWRITEBYTECODE=1 python3 Tests/test_ios_archive_audit.py
          PYTHONDONTWRITEBYTECODE=1 python3 Tests/test_unicorn_source_fetch.py
          PYTHONDONTWRITEBYTECODE=1 python3 Tests/test_production_link_map.py
          printf '#include "anisette_core.h"\nvoid test_reset(void) { reset_anisette_vm_uc(); }\n' | xcrun clang -x c -std=c11 -Werror=implicit-function-declaration -fsyntax-only -I Packages/AnisetteKit/Native/include -

      - name: Build IDevice xcframework for iOS 15
        run: |
          command -v cmake >/dev/null || brew install cmake
          bash Scripts/build-idevice-ios15.sh

      - name: Build and audit production Unicorn for iOS 15
        run: bash Scripts/build-on-device-anisette.sh

      - name: Generate standard production project (both engines, remote default)
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml

      - name: Archive and validate production IPA without signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild archive \
            -project EiliStore.xcodeproj \
            -scheme EiliStore \
            -destination 'generic/platform=iOS' \
            -archivePath build/EiliStore.xcarchive \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            LD_GENERATE_MAP_FILE=YES \
            'LD_MAP_FILE_PATH=$(TARGET_TEMP_DIR)/$(PRODUCT_NAME)-$(CURRENT_VARIANT)-$(CURRENT_ARCH)-LinkMap.txt' \
            2>&1 | tee build/xcodebuild.log
          grep -E -- '-D[[:space:]]*EILI_ON_DEVICE_ANISETTE([[:space:]]|$)' build/xcodebuild.log >/dev/null
          grep -F 'Packages/AnisetteKit/Native/anisette_core_uc.cpp' build/xcodebuild.log >/dev/null
          # Each target writes its own map. Inspect only the App map after linking.
          APP_LINK_MAPS=()
          while IFS= read -r map; do APP_LINK_MAPS+=("$map"); done < <(
            find build/DerivedData/Build/Intermediates.noindex/ArchiveIntermediates/EiliStore/IntermediateBuildFilesPath/EiliStore.build \
              -type f -name 'EiliStore-*-LinkMap.txt'
          )
          [[ ${#APP_LINK_MAPS[@]} -eq 1 ]] || { echo 'ERROR: expected exactly one App Link Map' >&2; exit 1; }
          cp "${APP_LINK_MAPS[0]}" build/production-link-map.txt
          # A symbol listed only as dead-stripped is not proof of engine inclusion.
          # Mach-O symbols can contain non-UTF-8 bytes; do not use locale-sensitive awk.
          python3 Scripts/verify-anisette-link-map.py build/production-link-map.txt
          BUILT_UNICORN=build/DerivedData/Build/Intermediates.noindex/ArchiveIntermediates/EiliStore/BuildProductsPath/Release-iphoneos/libunicorn.a
          cmp Packages/AnisetteKit/Artifacts/Unicorn.xcframework/ios-arm64/libunicorn.a "$BUILT_UNICORN"
          python3 Scripts/audit-ios-archive.py "$BUILT_UNICORN"
          if grep -Ei 'built for newer.*than being linked' build/xcodebuild.log; then
            echo 'ERROR: deployment-version mismatch remains; refusing to publish IPA' >&2
            exit 1
          fi
          python3 - <<'PY'
          import json, pathlib, plistlib
          app = pathlib.Path('build/EiliStore.xcarchive/Products/Applications/EiliStore.app')
          info = plistlib.loads((app / 'Info.plist').read_bytes())
          assert info.get('MinimumOSVersion') == '15.0', info.get('MinimumOSVersion')
          result = {'project': 'project.yml', 'minimum_iOS': info['MinimumOSVersion'],
                    'on_device_engine_linked': True, 'mode_test_script': 'Tests/run-anisette-tests.sh',
                    'apple_signing_enabled': False}
          pathlib.Path('build/production-validation.json').write_text(json.dumps(result, indent=2) + '\n')
          print('PASS: production archive includes On-Device engine and retains iOS 15 target; remote default verified by offline mode tests')
          PY
          mkdir -p build/Payload
          cp -r build/EiliStore.xcarchive/Products/Applications/EiliStore.app build/Payload/
          cd build && zip -r EiliStore.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: EiliStore-ipa
          path: build/EiliStore.ipa

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios15-validation-logs
          path: |
            build/xcodebuild.log
            build/production-link-map.txt
            build/production-validation.json
            Packages/AnisetteKit/.Unicorn.xcframework-stage-*/unicorn-disassembly.txt
          if-no-files-found: ignore
          retention-days: 7
