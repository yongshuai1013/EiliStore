# Keep project.yml and the remote Anisette runtime default unchanged.
# Override only the transitive package's binary using the same upstream sources.
include:
  - project.yml

packages:
  AnisetteKit:
    path: build/Dependencies/AnisetteKit

targets:
  EiliStore:
    dependencies:
      - package: AnisetteKit
# Intentionally no EILI_ON_DEVICE_ANISETTE compilation condition.
